name: Python UI/API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]

    # Добавляем таймаут чтобы пайплайн не висел вечно
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip libnss3 libxss1 libappindicator3-1 fonts-liberation

    # Улучшенная установка Chrome
    - name: Install Chrome
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        google-chrome --version

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/selenium
        key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.python-version }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Устанавливаем Allure CLI для генерации отчетов
        wget https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
        sudo tar -zxvf allure-2.24.1.tgz -C /opt/
        sudo ln -s /opt/allure-2.24.1/bin/allure /usr/bin/allure

    # Добавляем шаг для проверки что все установилось
    - name: Verify installations
      run: |
        python --version
        pip list
        google-chrome --version
        allure --version

    # Запускаем все тесты вместе с улучшенными опциями
    - name: Run tests
      run: |
        python -m pytest tests/ -v \
          --alluredir=allure-results \
          --html=report.html \
          --self-contained-html \
          --junitxml=report.xml \
          --maxfail=5 \
          --disable-warnings
      env:
        HEADLESS: "true"
        PYTEST_CURRENT_TEST: "1"  # Для лучшего логирования

    # Улучшенная генерация Allure отчета
    - name: Generate Allure report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean
        # Создаем index.html для удобного просмотра
        echo "<!DOCTYPE html><html><head><meta http-equiv='refresh' content='0; url=allure-report/index.html'></head></html>" > index.html

    - name: Upload Allure report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: allure-report-python${{ matrix.python-version }}
        path: |
          allure-report/
          index.html
        retention-days: 30

    - name: Upload test reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-reports-python${{ matrix.python-version }}
        path: |
          report.html
          report.xml
        retention-days: 14

    # Добавляем уведомление о статусе
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Tests failed on Python ${{ matrix.python-version }}"
        echo "Check the artifacts for detailed reports"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install linting tools
      run: |
        pip install black flake8 isort pytest

    - name: Check code formatting with black
      run: |
        black --check . --diff

    - name: Check imports with isort
      run: |
        isort --check-only . --diff

    - name: Run flake8
      run: |
        flake8 . --count --show-source --statistics --max-line-length=88 --extend-ignore=E501,W503,E203

    # Добавляем проверку тестов
    - name: Check test syntax
      run: |
        python -m py_compile tests/
        echo "✅ All test files compile correctly"
